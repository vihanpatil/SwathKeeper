# Bars for a SwathKeeper encounter flight in SITL, tool 0.3.0: the 2026-11-10 file (bars.yaml, beside this one) with
# ONE change. Its literal 4.4 m/s speed ceiling becomes two bars whose limit follows the log's own PARM WP_SPD.
# The other five bars are byte-for-byte the 2026-11-10 ones.
# Written and COMMITTED 2026-11-11 before a 0.3.0 tool existed to run it (0.2.0 refuses a mapping limit), from the
# ruled spec alone. NOT blind to the flights: the 2026-11-10 run already printed each log's WP_SPD and its fastest
# AUTO sample, so what these bars will read on speed is largely known. What is not known is whether any sample sits
# at or before the parameter's first PARM row, which is why this file exists in two variants: this one, and
# bars_param_key.yaml, which differs only by declaring limit_before_first_parm_row.
schema: swathkeeper-bars/1.0
contract: swathkeeper-flightlog/1.0
assume: [arming_before_first_arm_row]
bars:
  - id: speed_ceiling_auto
    kind: series_bound
    severity: must
    provenance:
      text: >-
        The mission speed THIS log commanded (PARM WP_SPD, m/s) plus the same 10 % author-chosen margin as the
        2026-11-10 file, accepted only inside the committed booking: WP_SPD from 1.0 to 5.0 m/s (ADR-020 am. 3
        books 5.0 m/s). A log commanded outside the booking is not judged by this bar. Every GPS sample of every
        instance in AUTO. min_n 100 = 20 s at 5 Hz.
      param: WP_SPD
    scope: {armed: null, modes: [AUTO]}
    min_n: 100
    params: {channel: velocity.groundspeed_mps, bound: ceiling, limit: {param: WP_SPD, scale: 1.1, accept: [1.0, 5.0]}}
  - id: speed_commanded_auto
    kind: series_bound
    severity: should
    provenance:
      text: >-
        The same ceiling with the accepted range widened to the 2026-11-10 session's whole unbooked sweep, WP_SPD
        from 1.0 to 6.0 m/s: did the vehicle stay within 10 % of whatever speed it was commanded. It says nothing
        about whether that speed was booked. Every GPS sample of every instance in AUTO. min_n 100.
      param: WP_SPD
    scope: {armed: null, modes: [AUTO]}
    min_n: 100
    params: {channel: velocity.groundspeed_mps, bound: ceiling, limit: {param: WP_SPD, scale: 1.1, accept: [1.0, 6.0]}}
  - id: gnss_quality_armed
    kind: gnss_quality
    severity: must
    provenance:
      text: >-
        AUTHOR-CHOSEN: while armed, every GPS row of every instance has a 3D fix and at least 6 satellites
        (max_outage_s 0 = every row). min_n 100 = 20 s at 5 Hz.
    scope: {armed: true, modes: null}
    min_n: 100
    params: {fix_min: 3, sats_min: 6, max_outage_s: 0}
  - id: designed_modes_only
    kind: mode_transitions
    severity: must
    provenance:
      text: >-
        ADR-006: the avoidance takes authority AUTO -> GUIDED and hands back GUIDED -> AUTO; the mission ends in RTL
        or LAND. Every observed transition must ENTER one of those four modes. Under LOG_DISARMED 0 the log starts at
        arming, so the startup row is covered by "*". min_n 1: one observed transition is a measurement.
    scope: {armed: null, modes: null}
    min_n: 1
    params: {allowed: [["*", AUTO], ["*", GUIDED], ["*", RTL], ["*", LAND]]}
  - id: field_geofence
    kind: containment
    severity: should
    provenance:
      text: >-
        The committed field polygon (config/field_polygon.json: 75 x 60 m about home) expanded by 15 m, one lane
        spacing, AUTHOR-CHOSEN because lane 1 lies on the west edge and a dodge is commanded up to 10 m sideways;
        and never more than 20 m above home (mission altitude 15.0 m + 5 m, author-chosen). While armed, every
        position sample and segment. min_n 100 segments = 10 s at 10 Hz.
      param: RTL_ALT_M
    scope: {armed: true, modes: null}
    min_n: 100
    params: {source: yaml, polygon: [[-35.3633967, 149.1650718], [-35.3633967, 149.1662284], [-35.3625883, 149.1662284], [-35.3625883, 149.1650718]], alt_max_rel_home_m: 20.0}
  - id: ekf_vel_ceiling_armed
    kind: series_bound
    severity: should
    provenance:
      text: >-
        AUTHOR-CHOSEN: XKF4.SV <= 0.8 on every logged core while armed. 0.8 equals the logged FS_EKF_THRESH; this
        is not the firmware's EKF failsafe logic. min_n 200 = 10 s at 10 Hz on each of two cores.
      param: FS_EKF_THRESH
    scope: {armed: true, modes: null}
    min_n: 200
    params: {channel: ekf.vel_ratio, bound: ceiling, limit: 0.8}
  - id: no_errors
    kind: no_events
    severity: should
    provenance:
      text: >-
        AUTHOR-CHOSEN: zero ERR rows in drop-free logging. Expected to read could not tell on this firmware when no
        ERR row exists: the reading that lets zero ERR rows count is cited for 4.5.x releases only. min_n 60 s.
    scope: {armed: null, modes: null}
    min_n: 60
    params: {kinds: [error]}
