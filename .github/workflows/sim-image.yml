name: SwathKeeper sim image (build + push)

# ✅ VERIFIED GREEN 2026-08-18 (run 32208264797): 27m18s total on hosted ubuntu-latest — free-disk
# 3m, base image 4m39s, CI image 17m31s (colcon: 14 packages in 13m53s at -j2, NO OOM; waf copter
# 1m32s), pushed ghcr.io/vihanpatil/fieldguard-sim:{<sha>,latest}. The 2026-08-05 feasibility fears
# (14GB disk / colcon OOM / time budget — docs/runbooks/SIM_CI.md) did not materialize for the
# image BUILD; the headless-render smoke flight (ci.yml `build-test-sim`) is still the unverified
# crux. Every run before this one died at Dockerfile.ci's first ROS-sourcing RUN layer — Docker's
# default /bin/sh (dash) cannot source ROS setup.bash (fixed: SHELL ["/bin/bash", "-c"]) — and then
# at rosdep over the base image's emptied apt lists (fixed: in-layer apt-get update).
#
# Deliberately DECOUPLED from ci.yml's per-push jobs: this build is heavy (a from-scratch ROS 2 +
# Gazebo + ArduPilot workspace compile) and does not need to run on every push/PR — only when the
# pinned versions or the image definition actually change, or on demand. ci.yml's `build-test-sim` job
# then just `docker pull`s the tag this workflow publishes; it never triggers a build itself.

on:
  workflow_dispatch: {}   # manual — the only trigger until a human confirms this builds green once
  # The push trigger below is DISABLED (2026-08-18) to match the line above, which was always the
  # documented intent: this build has never once passed, and its failure is currently GUARANTEED --
  # the pinned-SHA vcs-import layer sources /opt/ros/humble/setup.bash under /bin/sh (dash), which
  # cannot source ROS bash setup files ("cannot open /setup.sh", exit 2, observed on all three
  # 2026-08-18 main merges; CLAUDE.md was in `paths`, so every session-recording merge fired a
  # doomed 3-hour build and a failure notification). Fix before re-enabling: `SHELL ["/bin/bash",
  # "-c"]` in sim/docker/Dockerfile before ROS-sourcing RUN layers, then a WATCHED workflow_dispatch
  # run to confirm the never-yet-built later layers (colcon in 14GB, OOM risk -- see header) --
  # only after one green run does push-triggering earn its way back.
  # push:
  #   branches: [main]
  #   paths:
  #     - "sim/docker/Dockerfile.ci"
  #     - "sim/docker/Dockerfile"          # the base layer Dockerfile.ci is FROM
  #     - "CLAUDE.md"                       # pinned-SHA changes live here
  #     - ".github/workflows/sim-image.yml"

permissions:
  contents: read
  packages: write   # push to GHCR (ghcr.io/<owner>/fieldguard-sim)

jobs:
  build-and-push:
    name: Build pinned-SHA sim image, push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 180   # generous ceiling for a from-scratch ROS2+Gazebo+ArduPilot build; the
                            # honest expectation (see plan doc) is this MAY exceed hosted-runner limits
    steps:
      - uses: actions/checkout@v4

      - name: Free extra disk (hosted runner is 14GB SSD — this build is tight, see Dockerfile.ci)
        run: |
          set -euo pipefail
          echo "Disk before cleanup:"; df -h /
          # Standard hosted-runner disk-reclaim trick: drop preinstalled toolchains this job doesn't
          # use (Android SDK, .NET, GHC, CodeQL) to buy headroom for the workspace build + image layers.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          echo "Disk after cleanup:"; df -h /

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the base (Week 1) image
        run: |
          set -euo pipefail
          docker build -t fieldguard-sim:week1 -f sim/docker/Dockerfile .

      - name: Build the CI image (pinned SHAs, workspace baked in)
        run: |
          set -euo pipefail
          docker build -t fieldguard-sim:ci -f sim/docker/Dockerfile.ci .

      - name: Tag and push
        run: |
          set -euo pipefail
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LC}/fieldguard-sim"
          SHA_TAG="${IMAGE}:${{ github.sha }}"
          LATEST_TAG="${IMAGE}:latest"
          docker tag fieldguard-sim:ci "$SHA_TAG"
          docker tag fieldguard-sim:ci "$LATEST_TAG"
          docker push "$SHA_TAG"
          docker push "$LATEST_TAG"
          echo "Pushed $SHA_TAG and $LATEST_TAG"
