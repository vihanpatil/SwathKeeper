name: FieldGuard CI

# Runs on GitHub's servers on every push and pull request. You don't run this —
# GitHub does, in a fresh Ubuntu VM, and reports a green check or red X on each commit.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # ACTIVE NOW. Validates the tiger-team config + repo structure on every push.
  # This is meaningful from day one, before any ROS 2 code exists.
  # ---------------------------------------------------------------------------
  validate-config:
    name: Validate tiger-team config & structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: pip install pyyaml
      - name: Validate agents, settings.json, and structure
        run: python scripts/validate_agents.py

