  #   name: colcon build + tests + headless sim smoke + eval
  #   runs-on: ubuntu-latest
  #   container: ghcr.io/vihanpatil/fieldguard:latest   # pinned ROS 2 + Gazebo + ArduPilot image
  #   steps:
