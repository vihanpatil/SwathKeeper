name: SwathKeeper CI

# Runs on GitHub's servers on every push and pull request. You don't run this —
# GitHub does, in a fresh Ubuntu VM, and reports a green check or red X on each commit.
on:
  push:
  pull_request:
  workflow_dispatch: {}   # lets a human manually run build-test-sim (see that job's own comment --
                           # it's gated to workflow_dispatch only until confirmed green once)

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # ACTIVE NOW. Validates the tiger-team config + repo structure on every push.
  # This is meaningful from day one, before any ROS 2 code exists.
  # ---------------------------------------------------------------------------
  validate-config:
    name: Validate tiger-team config & structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: pip install pyyaml
      - name: Validate agents, settings.json, and structure
        run: python scripts/validate_agents.py

  # ---------------------------------------------------------------------------
  # ACTIVE (Week 2). Runs entirely on plain ubuntu-latest -- no Docker, no Gazebo, no ROS 2 --
  # because everything it exercises (fieldguard_planning geometry, the ADR-003 eval spike harness,
  # the stdlib generator scripts) is deliberately pure-Python, runs on every push, and needs no image.
  # The real headless-sim job is `build-test-sim` below (added Weeks 5-6, 2026-08-05) -- it needs the
  # Docker/Gazebo image and is manual-dispatch-only until a human confirms it runs green.
  #
  # Dependency policy (CLAUDE.md "pin everything"): the avoidance/planning core is stdlib-only by
  # design, but the Week-5 NDVI tests (test_ndvi_fusion.py, test_ndvi_georef.py) use numpy, so the
  # pinned requirements-eval.txt install MUST come before the test suite. (2026-08-18: it didn't --
  # tests ran first, ImportError'd on numpy, and this job was red for 12 days while the seed-42 FNR
  # safety gate never executed. Install-before-test is load-bearing; don't reorder.)
  # numpy+scipy are pinned in requirements-eval.txt to the exact versions verified locally on
  # Python 3.12.12 (see .claude/agent-memory/devops-reliability-engineer for the reference run).
  # ---------------------------------------------------------------------------
  planning-and-eval:
    name: Planning tests + eval spike harness (numpy/scipy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install eval harness dependencies (pinned; needed by the NDVI tests below)
        run: |
          set -euo pipefail
          pip install -r requirements-eval.txt

      - name: Planning test suite
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/fieldguard_planning -v

      - name: Host-side test suite (tests/test_*.py -- launcher + CI-gate config, no sim)
        # `if: always()` from here down -- see the comment block below this step.
        if: always()
        run: |
          set -euo pipefail
          # These live in tests/, not tests/fieldguard_planning/, on purpose (see their docstrings):
          # they test host-side artifacts -- scripts/fly_pipeline.sh and THIS workflow file -- not the
          # planning package. The discover -s above scopes to tests/fieldguard_planning and never
          # walks them; a second discover rooted one level up is the fix. The pattern is 'test_*.py'
          # rather than one filename so a new host-side test file cannot be silently un-run: unittest
          # discovery does NOT recurse into tests/fieldguard_planning (no __init__.py, and namespace-
          # package discovery was removed in Python 3.11) -- verified on 3.12, no test runs twice.
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      # WHY EVERY STEP BELOW CARRIES `if: always()` (2026-09-10). This repo runs a DECLARED red on
      # `main`: the 2026-08-25 real-detection take breached its own pre-registered clearance bar, the
      # gate calls it INVALID, and tests/test_ci_evidence_gate.py fails on purpose (README "main's CI
      # is red, on purpose"; docs/runbooks/AVOIDANCE_REAL_DETECTION.md 6a). A failing step SKIPS every
      # later step by default, so that one honest red took the seed-42 FNR regression, the scenario
      # regenerate+diff and the generator smoke test dark for 16 days -- and while they were dark, two
      # further failures (Linux-only float/staleness reds in tests/test_build_dashboard_data.py)
      # reached `main` unnoticed. A red that hides other reds is not honesty, it is a blindfold.
      # `if: always()` makes every gate report its own verdict, and the step below asserts that the
      # set of failures is EXACTLY the declared one.
      - name: Known reds are exactly the declared ones (KNOWN_RED allowlist + expiry)
        if: always()
        run: |
          set -euo pipefail
          # THE DENOMINATOR FIRST (the same rule as the evidence step below): `discover` on a
          # pattern that matches nothing prints "Ran 0 tests", says OK and exits 0 -- so deleting
          # the allowlist would turn this step green, which is the one outcome it may never have.
          if [ ! -f tests/test_known_red_allowlist.py ]; then
            echo "[ci] FAIL: tests/test_known_red_allowlist.py is gone. This step would have" >&2
            echo "     matched no tests and passed, having asserted nothing about which tests" >&2
            echo "     fail. Restore it or delete this step deliberately." >&2
            exit 1
          fi
          # Re-runs both test roots in a child process and compares the failing set against the
          # allowlist. Three ways to fail, all of them useful: an UNDECLARED red (the blindfold
          # above), a declared red that has started PASSING (a vacuous allowlist entry), and an
          # entry past its expiry date (a red nobody re-read).
          python3 -m unittest discover -s tests -p 'test_known_red_allowlist.py' -v

      - name: Scenario flight logs are current (regenerate + diff -- catches silent rot)
        if: always()
        run: |
          set -euo pipefail
          python3 eval/scenarios/generate_flight_logs.py
          git diff --exit-code eval/scenarios/

      - name: Validate committed live flight-log evidence (CPA + idle-run clobber guard)
        if: always()
        run: |
          set -euo pipefail
          # WHAT THIS SEES IN CI (measured, not assumed -- `git archive HEAD` + this exact command,
          # 2026-08-24): .gitignore ignores eval/results/* but RE-INCLUDES
          # `!eval/results/live_flight_log_*.json`, so a fresh checkout carries the two committed
          # live logs (2026-08-18, 2026-08-23) and this glob matches BOTH. The gate really runs: it
          # prints their CPA (0.0393 m / 0.0391 m -- the 2026-08-26 segment-path recompute; the markers
          # beside the logs still carry the superseded vertex-only 0.0597 / 0.0518), reports each as an
          # ACKNOWLEDGED SAFETY FINDING
          # against its sibling marker file, and exits 0. It also still catches the failure it was
          # born for -- the 2026-08-05 demo log silently clobbered by an idle run (empty
          # flown_path_enu, 720/720 debt).
          #
          # WHY THE COUNT IS ASSERTED: the checker treats an absent path as SKIP/exit 0 (right for a
          # tool a human points at a path), so this step was one .gitignore edit, rename or deletion
          # away from matching nothing, printing SKIP and going green having validated nothing. A
          # gate with no denominator does not score green in this repo (ADR-013 am. 16). The
          # denominator is printed on every run and zero is a hard FAIL -- ci.yml side, not a
          # checker flag, because "this CI run must have evidence to chew on" is a property of the
          # job, and a --fail-on-empty flag on a safety tool is also a --dont-fail-on-empty flag.
          #
          # NOT PASSED HERE, deliberately: eval/scenarios/*/flight_log.json. Those are OPEN-LOOP
          # stimulus fixtures -- their flown_path_enu is byte-identical to the scripted lawnmower and
          # the bird is parked ON the lane to force a dodge, so their "CPA" is a scenario parameter
          # no control law can move (proven: regenerating under today's law moved commanded setpoints
          # up to 17.2 m and left all four CPA numbers bit-identical -- 0.0000 / 0.0000 / 0.0000 /
          # 1.0000 m under the 2026-08-26 segment geometry; the old vertex-only closest_approach
          # read the turnaround fixture at 7.0000 m, a fly-through it could not see -- the property
          # proven was bit-identity across the control-law change, and that still holds).
          # They are gated by the regenerate+diff step above and by
          # test_safety_scenarios_pending.py; see ADR-013 amendment 16 and eval/scenarios/README.md.
          shopt -s nullglob
          logs=(eval/results/*flight_log*.json)
          echo "[ci] committed live flight logs matched: ${#logs[@]}"
          if [ "${#logs[@]}" -eq 0 ]; then
            echo "[ci] FAIL: the live flight-log evidence gate matched 0 files. Either the committed" >&2
            echo "     evidence was renamed/deleted or .gitignore stopped re-including" >&2
            echo "     eval/results/live_flight_log_*.json. A gate that validates nothing is not a" >&2
            echo "     gate -- restore the evidence or delete this step deliberately." >&2
            exit 1
          fi
          python3 scripts/check_live_flight_log.py "${logs[@]}"

      - name: Smoke-run stdlib generator scripts (catch import/CLI breakage)
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/gen_boustrophedon.py -o /tmp/smoke_boustrophedon.waypoints
          python3 scripts/gen_farm_world.py \
            --obstacles-out /tmp/smoke_static_obstacles.json \
            --world-out /tmp/smoke_farm_world.sdf
          # --help is the import/CLI smoke for the mission-geofence gate (argparse exits 0 only if
          # the module imports and the parser still builds); the gate itself runs in its own step
          # below, where its exit code decides the build.
          python3 scripts/check_mission_geofence.py --help > /dev/null

      - name: Gate the committed mission against the tree geofence in 3D
        if: always()
        run: |
          set -euo pipefail
          # R8, closed 2026-09-11 (ADR-022 amendment 2). This ran as
          # `python3 scripts/check_mission_geofence.py || true` from 2026-08-18: the script judged XY
          # ONLY, the committed mission's lane at x=15 flies straight down tree row 0 (-1.997 m), so
          # it exited 1 on a flight that is safe at 15 m -- and its exit code had to be thrown away.
          # An XY geofence that cannot fail is not one. The script now judges the flight path in 3D
          # with the executor's own geofence.unsafe_obstacle_3d (XY inside obstacle_radius_m AND z
          # inside the canopy band + the 1.0 m vertical margin), samples every leg at 0.5 m --
          # takeoff climb and RTL descent included -- still PRINTS the XY overlap on every run, and
          # exits 0 on the committed mission (leg 4: -1.997 m in XY, +10.200 m over the 4.80 m band
          # top). So the exit code gates from here: 1 = a leg enters a tree's volume, 2 = the
          # mission or the obstacle map could not be read. The mission itself is NOT re-planned --
          # every committed flight log flew it. tests/test_ci_evidence_gate.py::
          # TestMissionGeofenceGateIsArmed runs this block against a failing stub to keep it armed.
          python3 scripts/check_mission_geofence.py

      - name: Regenerate spike clip (fixed seed 42 -- the reproducibility regression)
        if: always()
        run: |
          set -euo pipefail
          python3 sim/spike/gen_spike_clip.py --seed 42 --out sim/spike/out/spike_seed42

      - name: Run eval spike harness end-to-end (label GT -> both baselines -> score)
        if: always()
        run: |
          set -euo pipefail
          bash eval/run_spike.sh

      - name: Assert no regression on the seed-42 headline metric
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/check_spike_regression.py eval/results/spike_scores.json

      - name: Upload eval metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-spike-metrics
          path: eval/results/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # ACTIVE (2026-08-18, ADR-014). The docs site is a rendering layer over docs/*.md, but its build
  # is also the repo's only automated doc-integrity gate: it exits 1 on any broken intra-repo .md
  # link and on source-vs-rendered heading drift (both gates added by the adversarial pass, see
  # ADR-014 amendment). Docs are this project's proof layer -- dead cross-references rotting
  # silently is exactly the failure class worth ~40 CI seconds per push. The markdown pin lives in
  # requirements-eval.txt (one home for all pinned deps; installing numpy/scipy alongside costs
  # seconds and keeps the pin single-sourced).
  # ---------------------------------------------------------------------------
  docs-site:
    name: Docs site builds (link + heading-parity gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies (markdown lives in requirements-eval.txt)
        run: pip install -r requirements-eval.txt
      - name: Build the docs site (fails on broken links or heading drift)
        run: python3 scripts/build_docs_site.py

  # ---------------------------------------------------------------------------
  # PROMOTED Weeks 5-6 (2026-08-05, devops-reliability-engineer) from "deferred until the image
  # exists" to committed -- see docs/runbooks/SIM_CI.md for the full plan, the honest feasibility
  # verdict on GitHub-hosted-runner Gazebo rendering (short version: NOT proven even by the upstream
  # ardupilot_gazebo/ardupilot projects' own CI, which build/lint-only on hosted runners -- see that
  # doc's "Feasibility verdict"), and the cut-list.
  #
  # ⚠️ MANUAL-DISPATCH ONLY (workflow_dispatch) until a human confirms one green run. This job pulls a
  # PREBUILT image (published by .github/workflows/sim-image.yml, itself manual/on-Dockerfile-change
  # only -- never rebuilds Gazebo+ArduPilot+ROS2 from scratch on every push) and flies a short (2-lane)
  # scripted mission through the farm world, headless. This job does NOT consume the ADR-007 NDVI
  # camera/thermal topics (no DDS, no ndvi_node) -- but the vehicle model it flies now DOES carry that
  # sensor pair (landed uncommitted mid-Week-5 by robotics-sim-engineer), so Gazebo's Sensors system
  # still renders it every frame regardless. Per docs/ROADMAP.md's Week-5 ordering, this job should run
  # AFTER the human's batched render-verification session (items 1-3: thermal kill-switch, pixel smoke
  # test, ADR-003 real-render re-confirm) -- see docs/runbooks/SIM_CI.md "Eval-gate hook" and its cut-
  # list item 6 (a camera-free CI-only world) if rendering makes this job unreliable. Flip the trigger
  # to `pull_request`/`push` only after a confirmed-green run -- do NOT flip it blind.
  # ---------------------------------------------------------------------------
  build-test-sim:
    name: Headless Gazebo/SITL smoke flight (manual until confirmed green)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read   # pull ghcr.io image published by sim-image.yml; needed even if the package
                        # ends up private (default for a new GHCR package) -- harmless if it's public
    container:
      # GHCR requires a lowercase image path; github.repository_owner is 'vihanpatil' (already
      # lowercase) for this repo, matching the tag sim-image.yml pushes -- if the owner ever changes
      # to something with uppercase, this needs a job-level lowercase workaround (container.image is
      # resolved before any step runs, so it can't reuse a step-computed value the way sim-image.yml's
      # OWNER_LC does).
      image: ghcr.io/${{ github.repository_owner }}/fieldguard-sim:latest
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Headless Gazebo + SITL scripted smoke mission (2 lanes, no camera render)
        run: |
          set -euo pipefail
          bash scripts/ci_sim_smoke.sh

      - name: Assert the scripted mission actually completed (no regression)
        run: |
          set -euo pipefail
          python3 scripts/check_sim_smoke.py eval/results/sim_smoke.json

      - name: Upload smoke-flight artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-smoke-metrics
          path: |
            eval/results/sim_smoke.json
            /tmp/ci_smoke_gz.log
            /tmp/ci_smoke_sitl.log
          if-no-files-found: warn

  # NEXT (not built yet -- see docs/runbooks/SIM_CI.md "Eval-gate hook"): once the ADR-007 real NDVI
  # render exists in sim/worlds/farmguard_field.sdf, extend build-test-sim to run eval/run_spike.sh
  # against the REAL render's output (drop-in per sim/spike/README.md's schema) and gate on FNR
  # regression the same way scripts/check_spike_regression.py already gates the synthetic clip.
