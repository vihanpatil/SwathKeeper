# Bars for the OLD-NAMES log (design §8): pymavlink's own 64 KiB test.BIN, ArduPlane V3.8.2-dev: 0.97 s of
# contract-type records, the verdict's duration_s (1.05 s across all record types, PARM included). The
# point is the ABSENT map, not airworthiness: EKF2 as NKF4 + NKF9 (no C column: cores 0 and 1), GPS without
# I and BAT without Inst (instance 0), no ARM, no ERR, no DSF, no VER. Every min_n is sized to a 0.97 s
# parser fixture and says nothing about a flight. NOT blind: message counts, the MSG banner, the single MODE
# row (MANUAL), the first GPS/BAT/NKF rows and the PARM values below were read before these bars.
schema: swathkeeper-bars/1.0
contract: swathkeeper-flightlog/1.0
bars:
  - id: alt_floor_armed
    kind: series_bound
    severity: should
    provenance:
      text: >-
        B1 scoped to armed: true. The log has no ARM row, so arming is ABSENT and the design's rule 1 makes this
        EVIDENCE_INSUFFICIENT whatever POS says. Limit AUTHOR-CHOSEN (-10 m, as on the demo). min_n 10.
    scope: {armed: true, modes: null}
    min_n: 10
    params: {channel: position.alt_rel_home_m, bound: floor, limit: -10.0}
  - id: battery_floor
    kind: series_bound
    severity: should
    provenance:
      text: >-
        B3 on BAT without an Inst column (read as instance 0). No BATT_LOW_VOLT is logged; the limit is
        AUTHOR-CHOSEN, 10.5 V = a 3-cell pack at 3.5 V/cell, assumed from the 12.4 V first row. min_n 5 rows.
    scope: {armed: null, modes: null}
    min_n: 5
    params: {channel: battery.voltage_v, bound: floor, limit: 10.5}
  - id: ekf_vel_ceiling
    kind: series_bound
    severity: must
    provenance:
      text: >-
        B4 across EKF2's NKF4 (core 0) and NKF9 (core 1). AUTHOR-CHOSEN 0.8 as on the demo (no FS_EKF_THRESH
        is logged here). min_n 20 rows over both cores.
    scope: {armed: null, modes: null}
    min_n: 20
    params: {channel: ekf.vel_ratio, bound: ceiling, limit: 0.8}
  - id: gnss_quality
    kind: gnss_quality
    severity: should
    provenance:
      text: >-
        B5 on GPS without an I column (instance 0), AUTHOR-CHOSEN as on the demo: fix >= 3, sats >= 6, every
        row. min_n 5 rows.
    scope: {armed: null, modes: null}
    min_n: 5
    params: {fix_min: 3, sats_min: 6, max_outage_s: 0}
  - id: mode_transitions
    kind: mode_transitions
    severity: should
    provenance:
      text: >-
        B7 with Plane names: the vehicle resolves from the MSG banner (there is no VER row). Allowed: entering
        a mode of the log's own FLTMODE1-6 = 10, 11, 10, 8, 5, 0 = {AUTO, RTL, AUTOTUNE, FBWA, MANUAL}. min_n 1
        real transition; the log's one MODE row is the startup write, judged as <start> -> MANUAL but not counted.
    scope: {armed: null, modes: null}
    min_n: 1
    params: {allowed: [["*", AUTO], ["*", RTL], ["*", AUTOTUNE], ["*", FBWA], ["*", MANUAL]]}
  - id: no_errors
    kind: no_events
    severity: must
    provenance:
      text: >-
        B8 as on the demo. Zero ERR rows at V3.8 is ABSENT (the citation is at 4.5.x) and there are no DSF rows,
        so the design's rule 1 makes this EVIDENCE_INSUFFICIENT. min_n 60.
    scope: {armed: null, modes: null}
    min_n: 60
    params: {kinds: [error]}
