# Bars for the demo log (design §4): a real Tarot X4, ArduCopter V4.5.5, flown 2024-08-05 by someone else.
# Registered POST-HOC: the log existed first, so its sidecar pins the log's sha256 and every verdict says
# (post-hoc). Limits come from the log's OWN parameters, except B1, B4, B5 and B8, which are the author's and
# say so. NO Tarot bar is blind: the build's draft run (2026-11-05) printed the measured values of B2, B3, B5,
# B6, B7 and B8, and the first registered verdict printed all eight before this file was re-registered; from
# the draft to this file no limit, min_n, severity or scope of those six changed (B7's allowed list went from
# six pairs to the equivalent three "*" pairs), the draft's two demonstration bars (an AUTO-scoped speed
# ceiling, an armed-scoped altitude floor) were dropped, and B1 and B4 were added with limits fixed before any
# run read them. armed: null everywhere: the only ARM row is the disarm at 836.27 s, and arming before it is
# ABSENT (contract rule 4).
schema: swathkeeper-bars/1.0
contract: swathkeeper-flightlog/1.0
bars:
  - id: alt_floor
    kind: series_bound
    severity: should
    provenance:
      text: >-
        B1, AUTHOR-CHOSEN: never more than 10 m below home. The value is the logged FENCE_ALT_MIN (-10), which
        this vehicle did NOT enforce (FENCE_TYPE 7 lacks the min-altitude bit 8). min_n 100 = 10 s of POS at
        its logged 10 Hz.
      param: FENCE_ALT_MIN
    scope: {armed: null, modes: null}
    min_n: 100
    params: {channel: position.alt_rel_home_m, bound: floor, limit: -10.0}
  - id: speed_ceiling_loiter
    kind: series_bound
    severity: must
    provenance:
      text: >-
        B2: log PARM LOIT_SPEED 1250 cm/s = 12.5 m/s, the Loiter speed the vehicle flew; WPNAV_SPEED governs
        neither AltHold nor Loiter and AltHold has no speed parameter, so there is no AltHold bar. Every GPS.Spd
        sample of every instance in LOITER. min_n 50 = 10 s of GPS at its logged 5 Hz.
      param: LOIT_SPEED
    scope: {armed: null, modes: [LOITER]}
    min_n: 50
    params: {channel: velocity.groundspeed_mps, bound: ceiling, limit: 12.5}
  - id: battery_floor
    kind: series_bound
    severity: must
    provenance:
      text: >-
        B3: log PARM BATT_LOW_VOLT 18.6 V applied INSTANTANEOUSLY to every BAT sample of every pack, stricter
        than the firmware's failsafe, which acts only after BATT_LOW_TIMER 10 s (BATT_FS_VOLTSRC 0 = raw volts).
        min_n 100 = 10 s of BAT at 10 Hz.
      param: BATT_LOW_VOLT
    scope: {armed: null, modes: null}
    min_n: 100
    params: {channel: battery.voltage_v, bound: floor, limit: 18.6}
  - id: ekf_vel_ceiling
    kind: series_bound
    severity: should
    provenance:
      text: >-
        B4, AUTHOR-CHOSEN: XKF4.SV <= 0.8 on every logged core. 0.8 equals the logged FS_EKF_THRESH, but what SV
        means against FS_EKF_THRESH is uncited (design §11.1 item 5): this is not the firmware's EKF failsafe.
        min_n 200 = 10 s of XKF4 at 10 Hz on each of two cores.
      param: FS_EKF_THRESH
    scope: {armed: null, modes: null}
    min_n: 200
    params: {channel: ekf.vel_ratio, bound: ceiling, limit: 0.8}
  - id: gnss_quality
    kind: gnss_quality
    severity: must
    provenance:
      text: >-
        B5, AUTHOR-CHOSEN: every GPS row of every instance has fix >= 3 (3D) and >= 6 satellites
        (max_outage_s 0 = every row). min_n 50 = 10 s of GPS at 5 Hz.
    scope: {armed: null, modes: null}
    min_n: 50
    params: {fix_min: 3, sats_min: 6, max_outage_s: 0}
  - id: geofence
    kind: containment
    severity: should
    provenance:
      text: >-
        B6: the log's own fence, FENCE_ENABLE 1, FENCE_TYPE 7: a 150 m cylinder about home (FENCE_RADIUS) and
        120 m above home (FENCE_ALT_MAX), on every POS sample and segment. The polygon bit (4) is printed as
        not judged (v1 reads no FNCE). The owner's template (24_safety_setup.param) says 350 m, commented
        "start with a 150m fence radius": cited as intent only. min_n 100 segments = 10 s of POS.
      param: FENCE_RADIUS
    scope: {armed: null, modes: null}
    min_n: 100
    params: {source: log}
  - id: mode_transitions
    kind: mode_transitions
    severity: must
    provenance:
      text: >-
        B7: every observed transition enters a mode of the log's own FLTMODE1-6 = 0,0,2,2,5,5 = {STABILIZE,
        ALT_HOLD, LOITER}. From "*" (any mode, or <start>) is exact here: a path through any other mode fails
        on entering it. min_n 1: one observed transition is a measurement.
    scope: {armed: null, modes: null}
    min_n: 1
    params: {allowed: [["*", STABILIZE], ["*", ALT_HOLD], ["*", LOITER]]}
  - id: no_errors
    kind: no_events
    severity: must
    provenance:
      text: >-
        B8, AUTHOR-CHOSEN: zero ERR rows in drop-free logging. Zero ERR rows is measurable (EMPTY, not ABSENT)
        only because the adapter cites AP_Logger at tag Copter-4.5.5: ERR is a critical block whose only losses
        are counted in DSF.Dp. min_n 60 = one minute of drop-free log.
    scope: {armed: null, modes: null}
    min_n: 60
    params: {kinds: [error]}
